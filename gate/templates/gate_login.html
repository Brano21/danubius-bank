<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Danubius CTF - access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1b2a;
         font-family:system-ui,Segoe UI,Arial,sans-serif;color:#e6edf3}
    .box{background:#152a41;border:1px solid #24405e;border-radius:12px;padding:28px 30px;width:330px}
    h1{margin:0 0 2px;font-size:1.4rem}
    .sub{color:#9fb3c8;font-size:.85rem;margin:0 0 18px}
    label{display:block;font-size:.82rem;color:#9fb3c8;margin:12px 0 0}
    input{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border-radius:8px;
          border:1px solid #2c4a6b;background:#0f2033;color:#e6edf3;font-size:.95rem}
    button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#2f7ae0;
           color:#fff;font-weight:600;cursor:pointer;font-size:.95rem}
    button:hover{background:#1f66c8}
    .err{color:#ff9aa2;background:#3a1620;border:1px solid #6b2733;padding:8px 10px;border-radius:8px;font-size:.85rem}
    .foot{margin:16px 0 0;font-size:.8rem;text-align:center}
    .foot a{color:#7fb0e8}
  </style>
</head>
<body>
  <div class="box">
    <h1>Danubius CTF</h1>
    <p class="sub">Sign in to the environment (verified players only)</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Player name<input name="username" autofocus autocomplete="off"></label>
      <label>Password<input name="password" type="password"></label>
      <button type="submit">Enter</button>
    </form>
    <p class="foot"><a href="/_gate/admin/login">Admin / monitoring &rarr;</a></p>
  </div>
</body>
</html>
