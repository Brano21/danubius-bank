{% extends "base.html" %}
{% block title %}Search - {{ bank_name }}{% endblock %}
{% block content %}
  <script>window.__proof="{{ nonce }}";</script>
  <h1>Site search</h1>
  <form method="get">
    <input name="q" value="{{ q }}" size="40" placeholder="search term">
    <button type="submit">Search</button>
  </form>
  {% if q %}
    <p>Results for: {{ q | safe }}</p>
  {% endif %}
  {% if flag %}
    <p class="flag">Flag W1-04: <code>{{ flag }}</code></p>
  {% endif %}
{% endblock %}
