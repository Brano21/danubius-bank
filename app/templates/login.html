{% extends "base.html" %}
{% block title %}Log in - {{ bank_name }}{% endblock %}
{% block content %}
  <h1>Log in</h1>
  {% if info %}<p class="ok">{{ info }}</p>{% endif %}
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form class="stack" method="post" action="{{ url_for('week1.login') }}">
    <label>Username</label>
    <input name="username" autofocus>
    <label>Password</label>
    <input name="password" type="password">
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('week1.register') }}">Register</a>.</p>
{% endblock %}
