{% extends "base.html" %}
{% block title %}New transfer - {{ bank_name }}{% endblock %}
{% block content %}
  <h1>New transfer</h1>
  <form class="stack" method="post">
    <label>Counterparty</label>
    <input name="counterparty" value="Test transfer">
    <label>Amount (EUR)</label>
    <input name="amount" value="10">
    <label>Note</label>
    <input name="note">
    <button type="submit">Send transfer</button>
  </form>
  {% if new_id %}
    <p>Transfer #{{ new_id }} created.
       <a href="{{ url_for('week1.report_to_admin', tx_id=new_id) }}">Report to admin for review</a></p>
  {% endif %}
{% endblock %}
