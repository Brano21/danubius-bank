{% extends "base.html" %}
{% block title %}Register - {{ bank_name }}{% endblock %}
{% block content %}
  <h1>Create account</h1>
  <p class="muted">Register with an email and password. (The email is not verified.)</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form class="stack" method="post">
    <label>Email</label>
    <input name="email" type="email" autofocus autocomplete="off">
    <label>Password</label>
    <input name="password" type="password">
    <label>Repeat password</label>
    <input name="password2" type="password">
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('week1.login') }}">Log in</a>.</p>
{% endblock %}
