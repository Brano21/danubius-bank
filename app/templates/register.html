{% extends "base.html" %}
{% block title %}Registracia - {{ bank_name }}{% endblock %}
{% block content %}
  <h1>Vytvorenie uctu</h1>
  <p class="muted">Zaregistruj sa emailom a heslom. (Email neoverujeme.)</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Email<br><input name="email" type="email" autofocus autocomplete="off"></label><br>
    <label>Heslo<br><input name="password" type="password"></label><br>
    <label>Heslo znova<br><input name="password2" type="password"></label><br>
    <button type="submit">Registrovat</button>
  </form>
  <p class="muted">Uz mas ucet? <a href="{{ url_for('week1.login') }}">Prihlas sa</a>.</p>
{% endblock %}
