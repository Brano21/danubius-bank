# Danubius Bank - CTF target. NEVER deploy to a production network.
# Clean reset:  docker compose down -v && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-danubius}
      POSTGRES_USER: ${DB_USER:-danubius}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-danubius}
      # W1-02 seed exception: this ONE flag is injected into the DB (as the VIP
      # card's masked number) so it can be leaked via UNION. NOT given to web.
      FLAG_W1_02: ${FLAG_W1_02:-RPC{unset_w1_02}}
    volumes:
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./seed/20-inject-w1-02-flag.sh:/docker-entrypoint-initdb.d/20-inject-w1-02-flag.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-danubius} -d ${DB_NAME:-danubius}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      WEEK: ${WEEK:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-danubius-not-secret}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-danubius}
      DB_USER: ${DB_USER:-danubius}
      DB_PASSWORD: ${DB_PASSWORD:-danubius}
      # --- Only the ACTIVE week's flags are injected here (defense in depth).
      # Week 1 (note: FLAG_W1_05 is deliberately NOT here - it lives only in
      # the isolated exporter container, added at Week 1):
      FLAG_W1_01: ${FLAG_W1_01:-RPC{unset_w1_01}}
      FLAG_W1_02: ${FLAG_W1_02:-RPC{unset_w1_02}}
      FLAG_W1_03: ${FLAG_W1_03:-RPC{unset_w1_03}}
      FLAG_W1_04: ${FLAG_W1_04:-RPC{unset_w1_04}}
      # Weeks 2-3 flags (emitted by app logic once that module is unlocked):
      FLAG_W2_01: ${FLAG_W2_01:-RPC{unset_w2_01}}
      FLAG_W2_02: ${FLAG_W2_02:-RPC{unset_w2_02}}
      FLAG_W2_03: ${FLAG_W2_03:-RPC{unset_w2_03}}
      FLAG_W2_04: ${FLAG_W2_04:-RPC{unset_w2_04}}
      FLAG_W2_05: ${FLAG_W2_05:-RPC{unset_w2_05}}
      FLAG_W3_01: ${FLAG_W3_01:-RPC{unset_w3_01}}
      FLAG_W3_02: ${FLAG_W3_02:-RPC{unset_w3_02}}
      FLAG_W3_03: ${FLAG_W3_03:-RPC{unset_w3_03}}
      FLAG_W3_04: ${FLAG_W3_04:-RPC{unset_w3_04}}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    # web is no longer published directly - it is reachable only via the gate.
    expose:
      - "8080"
    networks:
      - default
      - exporter_isolated

  # Secure access gate + operator dashboard. The ONLY published service.
  # Players authenticate here; every request is proxied to `web` and logged with
  # the player's real identity. Gate + logs live OUTSIDE the vulnerable app (own
  # SQLite DB), so nothing in the target can reach or tamper with the monitoring.
  gate:
    build: ./gate
    environment:
      UPSTREAM_URL: http://web:8080
      GATE_SECRET: ${GATE_SECRET:-change-me-gate-secret}
      GATE_ADMIN_USER: ${GATE_ADMIN_USER:-admin}
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:-change-me-admin}
      GATE_DB: /data/gate.db
      GATE_PLAYERS_FILE: /app/players.json
    volumes:
      - gate_data:/data
      - ./gate/players.json:/app/players.json:ro
    ports:
      - "8080:8000"
    depends_on:
      - web

  # W1-05 exporter: the ONLY container that yields a shell. Isolated on an
  # internal (no-egress) network with no route to db/ollama, cap_drop:ALL, and
  # only FLAG_W1_05 in its env. `web` also joins exporter_isolated to proxy the
  # filename; the exporter itself can reach nothing else.
  exporter:
    build: ./exporter
    environment:
      FLAG_W1_05: ${FLAG_W1_05:-RPC{unset_w1_05}}
    networks:
      - exporter_isolated
    cap_drop:
      - ALL
    # read_only omitted: the entrypoint writes /flag at startup. Isolation is
    # enforced by cap_drop:ALL + the internal network (no egress, no db/ollama).

  # Week 3 LLM assistant backend. Pulls the model on first start (~2GB into the
  # ollama_models volume). Not published; only web talks to it over the network.
  ollama:
    build: ./ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama

networks:
  # `default` is auto-created for db/web (has outbound). exporter is NOT on it.
  exporter_isolated:
    internal: true

volumes:
  ollama_models:
  gate_data:
