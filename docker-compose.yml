# Danubius Bank - CTF target. NEVER deploy to a production network.
#
# ONE stack, ONE command:  docker compose up -d --build
#   - the vulnerable bank behind its access gate  -> :8080
#   - the CTFd scoreboard (login, read, submit)   -> :80
#
# Player identity is single-sourced in CTFd: the gate validates every player
# login against CTFd (see gate/app.py), so an account created once in
# CTFd Admin works at both the scoreboard and the gate. There is NO separate
# player list to maintain.
#
# Reset ONLY the vulnerable app to a clean state (keeps CTFd scores/players):
#   docker compose rm -sfv db web && docker compose up -d
# Full wipe INCLUDING the scoreboard (careful - deletes players & scores):
#   docker compose down -v

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-danubius}
      POSTGRES_USER: ${DB_USER:-danubius}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-danubius}
      # W1-02 seed exception: this ONE flag is injected into the DB (as the VIP
      # card's masked number) so it can be leaked via UNION. NOT given to web.
      FLAG_W1_02: ${FLAG_W1_02:-RPC{unset_w1_02}}
    volumes:
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./seed/20-inject-w1-02-flag.sh:/docker-entrypoint-initdb.d/20-inject-w1-02-flag.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-danubius} -d ${DB_NAME:-danubius}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      WEEK: ${WEEK:-1}
      # Required (no default): fails fast if .env is missing.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-danubius}
      DB_USER: ${DB_USER:-danubius}
      DB_PASSWORD: ${DB_PASSWORD:-danubius}
      # --- Only the ACTIVE week's flags are injected here (defense in depth).
      # Week 1 (note: FLAG_W1_05 is deliberately NOT here - it lives only in
      # the isolated exporter container, added at Week 1):
      FLAG_W1_01: ${FLAG_W1_01:-RPC{unset_w1_01}}
      FLAG_W1_02: ${FLAG_W1_02:-RPC{unset_w1_02}}
      FLAG_W1_03: ${FLAG_W1_03:-RPC{unset_w1_03}}
      FLAG_W1_04: ${FLAG_W1_04:-RPC{unset_w1_04}}
      # Weeks 2-3 flags (emitted by app logic once that module is unlocked):
      FLAG_W2_01: ${FLAG_W2_01:-RPC{unset_w2_01}}
      FLAG_W2_02: ${FLAG_W2_02:-RPC{unset_w2_02}}
      FLAG_W2_03: ${FLAG_W2_03:-RPC{unset_w2_03}}
      FLAG_W2_04: ${FLAG_W2_04:-RPC{unset_w2_04}}
      FLAG_W2_05: ${FLAG_W2_05:-RPC{unset_w2_05}}
      FLAG_W3_01: ${FLAG_W3_01:-RPC{unset_w3_01}}
      FLAG_W3_02: ${FLAG_W3_02:-RPC{unset_w3_02}}
      FLAG_W3_03: ${FLAG_W3_03:-RPC{unset_w3_03}}
      FLAG_W3_04: ${FLAG_W3_04:-RPC{unset_w3_04}}
      # Week 4 flags are consumed by the evidence generator (offline artifacts),
      # not emitted by any route. Present so the operator can generate the bundle
      # from inside this container with the real values.
      FLAG_W4_01: ${FLAG_W4_01:-RPC{unset_w4_01}}
      FLAG_W4_02: ${FLAG_W4_02:-RPC{unset_w4_02}}
      FLAG_W4_03: ${FLAG_W4_03:-RPC{unset_w4_03}}
      FLAG_W4_04: ${FLAG_W4_04:-RPC{unset_w4_04}}
      FLAG_W4_05: ${FLAG_W4_05:-RPC{unset_w4_05}}
      WEEK4_KEY: ${WEEK4_KEY:-${GATE_ADMIN_PASSWORD}}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    # web is no longer published directly - it is reachable only via the gate.
    expose:
      - "8080"
    networks:
      - default
      - exporter_isolated

  # Secure access gate + operator dashboard. The ONLY published app service.
  # Players authenticate here; the gate validates their credentials against
  # CTFd (single source of truth), then proxies every request to `web` and logs
  # it with the player's real identity. Gate + logs live OUTSIDE the vulnerable
  # app (own SQLite DB), so nothing in the target can reach or tamper with the
  # monitoring. The operator dashboard uses GATE_ADMIN_* (set equal to the CTFd
  # admin in .env for a single admin credential).
  gate:
    build: ./gate
    restart: unless-stopped
    environment:
      UPSTREAM_URL: http://web:8080
      CTFD_URL: ${CTFD_URL:-http://ctfd:8000}
      GATE_SECRET: ${GATE_SECRET:?set GATE_SECRET in .env}
      GATE_ADMIN_USER: ${GATE_ADMIN_USER:?set GATE_ADMIN_USER in .env}
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?set GATE_ADMIN_PASSWORD in .env}
      GATE_DB: /data/gate.db
      # Optional local break-glass accounts (dev/offline); empty by default.
      GATE_PLAYERS_FILE: /app/players.json
      GATE_COOKIE_SECURE: ${GATE_COOKIE_SECURE:-0}
    volumes:
      - gate_data:/data
      - ./gate/players.json:/app/players.json:ro
    ports:
      # Bind the published port explicitly on IPv4 all-interfaces. Docker Desktop
      # otherwise tends to expose it via an IPv6 dual-stack listener only, which
      # some clients (e.g. Burp's JVM) fail to reach ("No response from remote
      # server") even though curl/browser retry through it fine.
      - "0.0.0.0:8080:8000"
    depends_on:
      - web
      - ctfd

  # W1-05 exporter: the ONLY container that yields a shell. Isolated on an
  # internal (no-egress) network with no route to db/ollama, cap_drop:ALL, and
  # only FLAG_W1_05 in its env. `web` also joins exporter_isolated to proxy the
  # filename; the exporter itself can reach nothing else.
  exporter:
    build: ./exporter
    restart: unless-stopped
    environment:
      FLAG_W1_05: ${FLAG_W1_05:-RPC{unset_w1_05}}
    networks:
      - exporter_isolated
    cap_drop:
      - ALL
    # read_only omitted: the entrypoint writes /flag at startup. Isolation is
    # enforced by cap_drop:ALL + the internal network (no egress, no db/ollama).

  # Week 3 LLM assistant backend. Pulls the model on first start (~2GB into the
  # ollama_models volume). Not published; only web talks to it over the network.
  ollama:
    build: ./ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama

  # --- CTFd scoreboard --------------------------------------------------------
  # The login-gated platform where players read challenges and submit flags.
  # Published on :80. Its db/redis stay on an internal network. Accounts created
  # here are the single source of truth the gate authenticates players against.
  ctfd:
    image: ctfd/ctfd:3.7.5
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      # CTFd needs a stable SECRET_KEY across its workers (sessions). Required.
      - SECRET_KEY=${CTFD_SECRET_KEY:?set CTFD_SECRET_KEY in .env}
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@ctfd-db/ctfd
      - REDIS_URL=redis://ctfd-cache:6379
      - WORKERS=2
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
    volumes:
      - ctfd-uploads:/var/uploads
      - ctfd-logs:/var/log/CTFd
    networks:
      - default          # reachable by the gate for login validation
      - ctfd_internal     # reaches its own db/redis
    depends_on:
      - ctfd-db
      - ctfd-cache

  ctfd-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${CTFD_DB_ROOT_PASSWORD:-ctfd-root-change-me}
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - ctfd-db:/var/lib/mysql
    networks:
      - ctfd_internal
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800

  ctfd-cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ctfd-redis:/data
    networks:
      - ctfd_internal

networks:
  # `default` is auto-created (has outbound). exporter/ctfd-db/redis are NOT on it.
  exporter_isolated:
    internal: true
  ctfd_internal:
    internal: true

volumes:
  ollama_models:
  gate_data:
  ctfd-uploads:
  ctfd-logs:
  ctfd-db:
  ctfd-redis:
